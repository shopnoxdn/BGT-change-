<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - TG-Lion</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        h2 {
            margin-bottom: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        button:active {
            transform: translateY(0);
        }
        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="login-card animate__animated animate__fadeInDown">
        <h2>Welcome Back</h2>
        <p style="margin-bottom: 2rem; color: #94a3b8;">Login with your History ID</p>
        <div id="login-section">
            <form id="login-form">
                <div id="error-message" style="color: #ff4d4d; margin-bottom: 1rem; font-size: 0.9rem; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 6px; border: 1px solid #ff4d4d; display: none;"></div>
                <div class="input-group">
                    <input type="text" id="user_id" name="user_id" placeholder="Enter your History ID" required autocomplete="off">
                </div>
                <button type="button" onclick="handleLogin()" class="animate__animated animate__pulse animate__infinite">Login Now</button>
            </form>
        </div>

        <div id="otp-section" style="display: none;">
            <p style="margin-bottom: 1rem; color: #94a3b8;">Enter the OTP sent to your Telegram</p>
            <form id="otp-form">
                <div id="otp-error" style="color: #ff4d4d; margin-bottom: 1rem; font-size: 0.9rem; background: rgba(239, 68, 68, 0.1); padding: 8px; border-radius: 6px; border: 1px solid #ff4d4d; display: none;"></div>
                <div class="input-group">
                    <input type="text" id="phone_number" placeholder="Phone Number (with country code)" required>
                </div>
                <div class="input-group" id="otp-input-group" style="display: none;">
                    <input type="text" id="otp_code" placeholder="Enter OTP" required>
                </div>
                <button type="button" id="otp-btn" onclick="requestOTP()">Send OTP</button>
            </form>
        </div>

        <script>
            let currentUserId = null;

            async function handleLogin() {
                const userId = document.getElementById('user_id').value;
                const errorDiv = document.getElementById('error-message');
                
                const formData = new FormData();
                formData.append('user_id', userId);

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (data.success) {
                        currentUserId = data.user_id;
                        document.getElementById('login-section').style.display = 'none';
                        document.getElementById('otp-section').style.display = 'block';
                    } else {
                        errorDiv.textContent = data.message || "Invalid ID";
                        errorDiv.style.display = 'block';
                    }
                } catch (e) {
                    errorDiv.textContent = 'Error connecting to server';
                    errorDiv.style.display = 'block';
                }
            }

            async function requestOTP() {
                const phone = document.getElementById('phone_number').value;
                const btn = document.getElementById('otp-btn');
                const otpGroup = document.getElementById('otp-input-group');
                const errorDiv = document.getElementById('otp-error');

                btn.disabled = true;
                btn.textContent = 'Sending...';

                try {
                    const res = await fetch('/request_otp', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({phone})
                    });
                    const data = await res.json();

                    if (data.success) {
                        if (data.authorized) {
                            // Already logged in on Telegram, but we need session
                            // Let's just fake a "success" verify to set session
                            await verifyOTP(true); 
                            return;
                        }
                        otpGroup.style.display = 'block';
                        btn.textContent = 'Verify OTP';
                        btn.onclick = () => verifyOTP(false);
                        errorDiv.style.display = 'none';
                    } else {
                        errorDiv.textContent = data.message;
                        errorDiv.style.display = 'block';
                        btn.textContent = 'Send OTP';
                    }
                } catch (e) {
                    errorDiv.textContent = 'Error connecting to server';
                    errorDiv.style.display = 'block';
                    btn.textContent = 'Send OTP';
                } finally {
                    btn.disabled = false;
                }
            }

            async function verifyOTP(skipTelethon = false) {
                const phone = document.getElementById('phone_number').value;
                const otp = document.getElementById('otp_code').value;
                const errorDiv = document.getElementById('otp-error');
                const btn = document.getElementById('otp-btn');

                btn.disabled = true;
                btn.textContent = 'Verifying...';

                try {
                    const res = await fetch('/verify_otp', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            phone, 
                            otp: skipTelethon ? '00000' : otp, 
                            user_id: currentUserId,
                            skip: skipTelethon
                        })
                    });
                    const data = await res.json();

                    if (data.success) {
                        window.location.href = '/dashboard';
                    } else {
                        errorDiv.textContent = data.message;
                        errorDiv.style.display = 'block';
                    }
                } catch (e) {
                    errorDiv.textContent = 'Verification failed';
                    errorDiv.style.display = 'block';
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Verify OTP';
                }
            }
        </script>
        <div class="footer-text">
            Need an ID? Check the bot "My History" section.
        </div>
    </div>
</body>
</html>
